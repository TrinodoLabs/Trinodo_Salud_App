name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "client/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
  # Sin `paths` en pull_request: si la rama protegida exige este check,
  # los PRs sin cambios de client nunca lo reportarian y quedarian stuck
  # (aprendizaje del ciclo previo). En `push` se mantiene `paths`.
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm build

  # server:
  #   Se habilita cuando se decida el stack y exista un comando de build en server/package.json.
